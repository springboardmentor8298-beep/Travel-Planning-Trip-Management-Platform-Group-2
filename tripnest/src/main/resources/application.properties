spring.application.name=tripnest

# ==============================
# Database Configuration (MySQL)
# ==============================
spring.datasource.url=jdbc:mysql://localhost:3306/tripnest_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================
# JPA / Hibernate
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Dialect is auto-detected by Hibernate 6 — no need to set explicitly

# Ensure Hibernate creates/updates all tables BEFORE any DataSource initialization runs
spring.jpa.defer-datasource-initialization=true
# Roles are seeded by TripnestApplication CommandLineRunner — no need to run data.sql
spring.sql.init.mode=never

# ==============================
# JWT Configuration
# ==============================
tripnest.app.jwtSecret=TripNestSecretKey2024VeryLongSecretKeyForJWTSigningThatMustBeAtLeast256BitsLong
tripnest.app.jwtExpirationMs=86400000
tripnest.app.jwtCookieName=tripnest

# ==============================
# Server
# ==============================
server.port=8085

# ==============================
# Logging
# ==============================
logging.level.com.tripnest=DEBUG
logging.level.org.springframework.security=INFO

# ==============================
# OAuth2 Configuration
# ==============================
# Google OAuth2 (Replace with actual client ID and secret)
spring.security.oauth2.client.registration.google.client-id=YOUR_GOOGLE_CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=YOUR_GOOGLE_CLIENT_SECRET
spring.security.oauth2.client.registration.google.scope=profile,email

# GitHub OAuth2 (Replace with actual client ID and secret)
spring.security.oauth2.client.registration.github.client-id=YOUR_GITHUB_CLIENT_ID
spring.security.oauth2.client.registration.github.client-secret=YOUR_GITHUB_CLIENT_SECRET
spring.security.oauth2.client.registration.github.scope=user:email

spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo

spring.security.oauth2.client.provider.github.authorization-uri=https://github.com/login/oauth/authorize
spring.security.oauth2.client.provider.github.token-uri=https://github.com/login/oauth/access_token
spring.security.oauth2.client.provider.github.user-info-uri=https://api.github.com/user
