spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ------------------------------------------------------------------
# THIS IS THE FIX for "signup/login doesn't work":
# Hibernate creates the tables (ddl-auto=update) but Spring's data.sql
# seed script normally tries to run BEFORE those tables exist, so the
# roles never got inserted -> signup crashed with "Role is not found."
# These two lines make Spring wait until Hibernate finishes creating
# the schema, THEN run data.sql to insert the roles.
# ------------------------------------------------------------------
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

tripnest.app.jwtSecret=tripnestSecretKey123456789012345678901234567890
tripnest.app.jwtExpirationMs=86400000

