server.port=8080

# Active Profile: 'postgres' for PostgreSQL (5432) or 'mysql' for MySQL (3306)
spring.profiles.active=postgres

# PostgreSQL Default (Database: tn_web)
spring.datasource.url=jdbc:postgresql://localhost:5432/tn_web
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=110806
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Hibernate & JPA settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Multipart Upload Limit
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

