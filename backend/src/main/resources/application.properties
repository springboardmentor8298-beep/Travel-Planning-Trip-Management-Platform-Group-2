# ============================
# Application
# ============================
spring.application.name=tripnest-backend

# ============================
# Server Configuration (SSL & Reverse Proxy Ready)
# ============================
server.port=${PORT:8080}
server.forward-headers-strategy=native

# ============================
# MySQL Configuration (Production & Development Environment Variables)
# ============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/tripnest}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Gowthambabu@1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================
# JPA / Hibernate
# ============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ============================
# JWT Configuration
# ============================
jwt.secret=${JWT_SECRET:VHJpcE5lc3RTZWNyZXRLZXlGb3JKd3RBdXRoZW50aWNhdGlvbjIwMjZUcmlwTmVzdFNlY3JldEtleQ==}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ============================
# CORS Allowed Origins
# ============================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,https://tripnest.vercel.app}

# ============================
# File Upload Configuration
# ============================
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# ============================
# Google OAuth & Spring Security OAuth2 Client
# ============================
google.client.id=${GOOGLE_CLIENT_ID:98818561312-ohganbss4r6ci6ms01dm9m60kgfgbbt0.apps.googleusercontent.com}
google.client.secret=${GOOGLE_CLIENT_SECRET:dummy_google_client_secret}

spring.security.oauth2.client.registration.google.client-id=${google.client.id}
spring.security.oauth2.client.registration.google.client-secret=${google.client.secret}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}