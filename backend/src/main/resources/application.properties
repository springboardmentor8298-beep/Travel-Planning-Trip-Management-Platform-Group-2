spring.application.name=tripnest-backend
server.port=8080

# ==============================
# ACTIVE DATABASE: MySQL (local development)
# Make sure MySQL is running locally before starting the app.
# The database "tripnest_db" is created automatically on first run
# (createDatabaseIfNotExist=true) - you do NOT need to create it manually.
# ==============================
spring.datasource.url=jdbc:mysql://localhost:3306/tripnest_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:CHANGE_ME}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==============================
# JWT
# ==============================
app.jwt.secret=TripNestSuperSecretKeyForJWTSigningChangeThisInProduction1234567890
app.jwt.expiration-ms=86400000

# ==============================
# Google OAuth2
# ==============================
# Set GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET in your environment or replace the placeholders.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:YOUR_GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google
app.oauth2.success-redirect=http://localhost:3000/oauth2/redirect

# ==============================
# CORS (React dev server)
# =============================
app.cors.allowed-origins=http://localhost:3000

# ==============================
# ALTERNATIVE DATABASES (only ONE datasource block should ever be
# active at a time - never uncomment more than one set of spring.datasource.*
# lines in this file, or Spring Boot will silently use whichever is defined
# last, and behavior becomes unpredictable)
# ==============================

