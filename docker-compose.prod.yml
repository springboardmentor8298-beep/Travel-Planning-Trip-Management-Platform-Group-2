services:
  # 1. MySQL Database Service
  db:
    image: mysql:8
    container_name: tripnest-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-VSSSM@2006}
      MYSQL_DATABASE: tripnest_db
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "--password=${DB_PASSWORD:-VSSSM@2006}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 2. Spring Boot Backend Service
  backend:
    build:
      context: ./tripnest
      dockerfile: Dockerfile
    container_name: tripnest-backend
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/tripnest_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-VSSSM@2006}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      TRIPNEST_UPLOAD_DIR: /uploads
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 10MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 15MB
    volumes:
      - uploads_data:/uploads
    depends_on:
      db:
        condition: service_healthy

  # 3. React Frontend Service (served via Nginx)
  frontend:
    build:
      context: ./tripnest-frontend
      dockerfile: Dockerfile
    container_name: tripnest-frontend
    restart: always
    ports:
      # Expose directly on port 80 for production instead of 8081
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data:
  uploads_data:
