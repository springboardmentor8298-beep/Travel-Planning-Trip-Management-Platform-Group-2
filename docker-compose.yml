version: "3.8"

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpassword}
      MYSQL_DATABASE: tripnest_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./tripnest-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/tripnest_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-rootpassword}
      APP_JWT_SECRET: ${JWT_SECRET:-ChangeThisToALongRandomSecretKeyForJWTSigning123456}
      APP_CORS_ALLOWED_ORIGINS: ${FRONTEND_URL:-http://localhost:3001}
    ports:
      - "8081:8081"
    volumes:
      - uploads_data:/app/uploads

volumes:
  mysql_data:
  uploads_data:
