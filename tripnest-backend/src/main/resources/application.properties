spring.application.name=tripnest-backend

# ---------- LOCAL DEV: MySQL ----------
spring.datasource.url=jdbc:mysql://localhost:3306/tripnest_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Sairam@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---------- Server ----------
server.port=8081

# ---------- JWT ----------
# Use a long random secret in real deployments (32+ chars, base64 recommended)
app.jwt.secret=ChangeThisToALongRandomSecretKeyForJWTSigning123456
app.jwt.expiration-ms=86400000

# ---------- Milestone 3: Document Uploads ----------
app.file.upload-dir=./uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---------- CORS ----------
# Comma-separated list. Update this if your frontend runs on a different port.
app.cors.allowed-origins=http://localhost:3000,http://localhost:3001

# ---------- Destination Seed Data ----------
# By default Spring Boot only auto-runs data.sql for embedded databases,
# and would try to run it BEFORE Hibernate creates the tables. Both
# properties below are required for a real MySQL DB with ddl-auto=update.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
