spring.application.name=tripnest-backend

# ---------- LOCAL DEV: MySQL ----------
spring.datasource.url=jdbc:mysql://localhost:3306/tripnest_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=your_mysql_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---------- Server ----------
server.port=8080

# ---------- JWT ----------
# Use a long random secret in real deployments (32+ chars, base64 recommended)
app.jwt.secret=ChangeThisToALongRandomSecretKeyForJWTSigning123456
app.jwt.expiration-ms=86400000
